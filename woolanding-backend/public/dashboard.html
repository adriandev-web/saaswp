<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WooLanding AI Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f7fafc;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .welcome-card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 32px;
        }

        .welcome-card h2 {
            color: #2d3748;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .welcome-card p {
            color: #718096;
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            color: #718096;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #2d3748;
            font-size: 32px;
            font-weight: 700;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            color: #2d3748;
            font-size: 20px;
            margin-bottom: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #718096;
            font-weight: 500;
        }

        .info-value {
            color: #2d3748;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #c6f6d5;
            color: #2f855a;
        }

        .badge-warning {
            background: #feebc8;
            color: #c05621;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🚀 WooLanding AI</h1>
        <div class="navbar-right">
            <div class="user-info">
                <div class="avatar" id="userAvatar"></div>
                <span id="userName"></span>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container" id="content">
        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 16px;">Loading your dashboard...</p>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;
        const API_VERSION = 'v1';

        async function fetchUserProfile() {
            const token = localStorage.getItem('accessToken');

            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/${API_VERSION}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    return data.data.user;
                } else if (response.status === 401) {
                    // Token expired, try to refresh
                    const refreshed = await refreshToken();
                    if (refreshed) {
                        return fetchUserProfile();
                    } else {
                        window.location.href = '/login.html';
                    }
                } else {
                    throw new Error('Failed to fetch profile');
                }
            } catch (error) {
                console.error('Error fetching profile:', error);
                window.location.href = '/login.html';
            }
        }

        async function refreshToken() {
            const refreshToken = localStorage.getItem('refreshToken');

            if (!refreshToken) {
                return false;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/${API_VERSION}/auth/refresh`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ refreshToken })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('accessToken', data.data.accessToken);
                    localStorage.setItem('refreshToken', data.data.refreshToken);
                    return true;
                }
            } catch (error) {
                console.error('Error refreshing token:', error);
            }

            return false;
        }

        async function logout() {
            const token = localStorage.getItem('accessToken');

            if (token) {
                try {
                    await fetch(`${API_BASE_URL}/${API_VERSION}/auth/logout`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }

            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        function getInitials(name) {
            return name
                .split(' ')
                .map(n => n[0])
                .join('')
                .toUpperCase()
                .substring(0, 2);
        }

        function renderDashboard(user) {
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userAvatar').textContent = getInitials(user.name);

            const emailVerifiedBadge = user.emailVerified
                ? '<span class="badge badge-success">Verified</span>'
                : '<span class="badge badge-warning">Not Verified</span>';

            const content = `
                <div class="welcome-card">
                    <h2>Welcome back, ${user.name}!</h2>
                    <p>Manage your WooLanding AI account and generate amazing landing pages.</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Generated Pages</div>
                        <div class="stat-value">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Current Plan</div>
                        <div class="stat-value">Free</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Remaining Credits</div>
                        <div class="stat-value">3</div>
                    </div>
                </div>

                <div class="card">
                    <h3>Account Information</h3>
                    <div class="info-row">
                        <span class="info-label">Email</span>
                        <span class="info-value">${user.email} ${emailVerifiedBadge}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Name</span>
                        <span class="info-value">${user.name}</span>
                    </div>
                    ${user.companyName ? `
                    <div class="info-row">
                        <span class="info-label">Company</span>
                        <span class="info-value">${user.companyName}</span>
                    </div>
                    ` : ''}
                    <div class="info-row">
                        <span class="info-label">Account Status</span>
                        <span class="info-value"><span class="badge badge-success">${user.status}</span></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Member Since</span>
                        <span class="info-value">${new Date(user.createdAt).toLocaleDateString()}</span>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = content;
        }

        // Initialize dashboard
        (async function() {
            const user = await fetchUserProfile();
            if (user) {
                renderDashboard(user);
            }
        })();
    </script>
</body>
</html>
